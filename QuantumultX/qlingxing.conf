[mitm]
# 开启 MITM 后，请在 Quantumult X 本机生成、安装并信任证书。
# 证书私钥和 passphrase 不得提交到仓库。
# Sub-Store declares sub.store in its own named rewrite resource.
skip_validating_cert = false
force_sni_domain_name = false
