// Source of truth for QuantumultX/qlingxing.conf. Edit this file, then run scripts/build-profiles.sh.
// ==UserScript==
// @ConfigName        qlingxing自用的QX配置文件
// @Author            @qlingxing💡
// @UpdateTime        2026/07/30 UTC/GMT +8
// @ConfigURL         https://raw.githubusercontent.com/qlingxing/Config/main/QuantumultX/qlingxing.conf

[general]
udp_drop_list=443
# > 用于节点延迟测试
server_check_url= http://www.gstatic.com/generate_204
# > 服务器测试超时时间 (毫秒)
server_check_timeout = 3000
# > 用于设置图标显示
profile_img_url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Google.png
# > 用于Check节点IP地址(以下geo_location_checker任选一个即可)
;geo_location_checker=disabled
;geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
# > 功能强大的解析器，用于引用资源的转换
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# > 下列路径将不经过QuanX的处理
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
udp_whitelist=1-442, 444-65535
# > 第一个filter为4g模式开启规则分流，第二个filter为其他wifi下开启规则分流，第三个wifi1修改成你路由器翻墙的wifi名开启直连模式，第四个wifi2为你公司或者其他有路由器翻墙的WiFi名走直连）
# > 默认关闭根据wifi切换模式，如需开启，删除下方的"#"即可
#running_mode_trigger=filter, filter, wifi1:all_direct, wifi2: all_direct
# > dns_exclusion_list
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn



[task_local]

# > 请手动添加下面的订阅（流媒体Task订阅集合）
; https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/UI-Action.json
# > 流媒体解锁查询
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁查询, img-url=arrowtriangle.right.square.system, enabled=true



[rewrite_local]

[rewrite_remote]
# 远程重写订阅
# 包含主机名 hostname 以及复写 rewrite 规则
# update-interval 为更新时间参数，单位：秒, 默认更新时间为：24*60*60=86400 秒，也就是24小时
# opt-parser=true/false 用于控制是否对订阅开启资源解析器，不写或者 false 表示不启用解析器
# ======= 核心：Sub-Store ======= #
# Official Sub-Store QX snippet; keep it separate and independently manageable.
https://raw.githubusercontent.com/sub-store-org/Sub-Store/master/config/QX.snippet,tag=Sub-Store,update-interval=172800,opt-parser=false,enabled=true

# ======= 推荐重写：广告与网页优化 ======= #

https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf,tag=油管去广告@Maasea, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.conf,tag=Advertising (blackmatrix7), update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Redirect/Redirect.conf,tag=Redirect (blackmatrix7), update-interval=172800, opt-parser=false, enabled=true

# ======= 实验性服务响应改写：默认关闭 ======= #
# 这些规则会修改服务端响应，可能影响账号与服务可用性；按需手动启用。
# Spotify service-response rewrite was removed because its upstream resource no
# longer existed. The current Spotify module is kept disabled because it changes
# account-facing responses and requires MITM.
https://raw.githubusercontent.com/app2smile/rules/master/module/spotify.conf,tag=Spotify增强(实验), update-interval=86400, opt-parser=false, enabled=false
https://raw.githubusercontent.com/app2smile/rules/master/module/bilibili-qx.conf,tag=BiliBili增强(实验), update-interval=86400, opt-parser=false, enabled=false
# Emby enhancement applies only to the upstream's named public-service hosts;
# it is not a general Emby unlock and must remain manually enabled.
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/Function/EmbyPlugin.conf,tag=Emby增强(特定服务端), update-interval=86400, opt-parser=false, enabled=false

# ======= 自行启用 ======= #
#https://raw.githubusercontent.com/chavyleung/scripts/master/box/rewrite/boxjs.rewrite.quanx.conf,tag=BoxJS商店版@chavyleung, update-interval=86400, opt-parser=false, enabled=false


[server_local]



[server_remote]
# Sub-Store All collection. Keep the official Sub-Store rewrite enabled.
https://sub.store/download/collection/All?target=QX, tag=Sub-Store All, enabled=true

# Add a raw provider subscription in the imported profile. Keep provider URLs
# out of Git.
# https://example.com/subscription, tag=Raw Subscription, enabled=true






[dns]

;prefer-doh3
;doh-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query
# > Default to IPv4. Enable IPv6 only after the provider and local network have
# > been tested; otherwise IPv6 can bypass or diverge from the intended route.
no-ipv6
no-system
server=223.5.5.5
server=119.29.29.29
server=114.114.114.114
server=/*.icloud.com/119.29.29.29
server=/*.icloud.com.cn/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.weixin.com/119.29.29.29



[policy]

## 策略组
## 将分流规则传递过来的网络请求进行分发
# 节点池同时包含手动节点、原始订阅和 Sub-Store 产物。首次导入时默认直连，
# reject 保留为可手动选择的严格模式。
static=全部节点, direct, server-tag-regex=.*
url-latency-benchmark=自动选择, server-tag-regex=.*, check-interval=600, tolerance=0, alive-checking=false,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Auto.png
# 服务器按地区分组策略
static=美国节点, server-tag-regex=(?i)(United States|美国|美西|美东|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇺🇸|(^|[-._ ])(US|USA)($|[-._ ])),img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Country/US.png
static=英国节点, server-tag-regex=(?i)(United Kingdom|英国|伦敦|Manchester|🇬🇧|(^|[-._ ])(UK|GB)($|[-._ ])),img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Country/UK.png
static=香港节点, server-tag-regex=(?i)(Hong Kong|HongKong|香港|🇭🇰|(^|[-._ ])(HK|HKG)($|[-._ ])),img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Country/HK02.png
static=日本节点, server-tag-regex=(?i)(Japan|日本|东京|大阪|埼玉|🇯🇵|(^|[-._ ])JP($|[-._ ])),img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Country/JP.png
static=台湾节点, server-tag-regex=(?i)(Taiwan|台湾|台北|🇹🇼|(^|[-._ ])TW($|[-._ ])),img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Country/TW.png
static=新加坡节点, server-tag-regex=(?i)(Singapore|新加坡|狮城|🇸🇬|(^|[-._ ])SG($|[-._ ])),img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Country/SG.png
# 这是所有代理服务的统一默认出口。
static=代理, direct, 自动选择, 香港节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 台湾节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Proxy.png
# Global策略
static=Global, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 台湾节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Proxy.png
# GlobalMedia策略
static=GlobalMedia, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 台湾节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/GMedia.png
# 国外媒体细分策略
# > Youtibe策略
static=YouTube, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 台湾节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/YouTube.png
# > 🎥 Netflix策略
static=🎥 Netflix, 代理, 美国节点, 日本节点, 新加坡节点, 香港节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Netflix.png
# > 🐭 Disney+策略
