# > OpenAI策略
static=OpenAI, 代理, 美国节点, 日本节点, 新加坡节点, 英国节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Telegram.png
# > Twitter策略
static=Twitter, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 台湾节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Twitter.png
# > Speedtest策略
