# > 🍎 苹果服务策略
static=🍎 苹果服务, 代理, direct, 美国节点, 香港节点, 日本节点, 台湾节点, 新加坡节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Apple.png
# > Google策略
static=Google, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 台湾节点, 全部节点, reject,img-url=https://raw.githubusercontent.com/qlingxing/Config/main/icon/Policy-Filter/Google.png
