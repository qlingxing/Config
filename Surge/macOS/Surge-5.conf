#!MANAGED-CONFIG https://raw.githubusercontent.com/qlingxing/Config/main/Surge/macOS/Surge-5.conf interval=86400 strict=false
# Generated from source/surge. Do not edit this file in the repository.
# Surge Mac 5.7+ base profile
# Put device-specific nodes and MITM certificate material in an editable copy.

[General]
# Keep this set aligned with the known-good Mac 5 profile syntax.
loglevel = notify
# Surge Mac 5 uses doh-server rather than the newer encrypted-dns-server form.
doh-server = https://223.5.5.5/dns-query
dns-server = 223.5.5.5, 119.29.29.29
exclude-simple-hostnames = true
ipv6 = false
test-timeout = 4
proxy-test-url = http://cp.cloudflare.com/generate_204

[Proxy]
# Add manual nodes in Surge's Proxies screen or to the imported local copy.
# My Node = ss, server.example.com, 443, encrypt-method=aes-256-gcm, password=CHANGE_ME

[Proxy Group]
# 启用官方 Sub-Store 模块后，此隐藏组加载 All 集合。手动节点也会
# 汇入该组；它不包含 DIRECT，避免智能选择误选直连。
节点来源 = select, include-all-proxies=true, policy-path=https://sub.store/download/collection/All?target=SurgeMac, update-interval=86400, hidden=1
全部节点 = select, DIRECT, include-other-group=节点来源
自动选择 = smart, include-other-group=节点来源, policy-regex-filter=.*
香港节点 = smart, include-other-group=节点来源, policy-regex-filter=(?i)(Hong Kong|HongKong|香港|🇭🇰|(^|[-._ ])(HK|HKG)($|[-._ ]))
日本节点 = smart, include-other-group=节点来源, policy-regex-filter=(?i)(Japan|日本|东京|大阪|埼玉|🇯🇵|(^|[-._ ])JP($|[-._ ]))
新加坡节点 = smart, include-other-group=节点来源, policy-regex-filter=(?i)(Singapore|新加坡|狮城|🇸🇬|(^|[-._ ])SG($|[-._ ]))
美国节点 = smart, include-other-group=节点来源, policy-regex-filter=(?i)(United States|美国|美西|美东|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇺🇸|(^|[-._ ])(US|USA)($|[-._ ]))
台湾节点 = smart, include-other-group=节点来源, policy-regex-filter=(?i)(Taiwan|台湾|台北|🇹🇼|(^|[-._ ])TW($|[-._ ]))

# 只需在代理中选择一次节点；所有服务策略默认都跟随它。
代理 = select, DIRECT, 自动选择, 香港节点, 日本节点, 新加坡节点, 美国节点, 台湾节点, 全部节点, REJECT

苹果服务 = select, 代理, DIRECT, 香港节点, 日本节点, 美国节点, 全部节点, REJECT
OpenAI = select, 代理, 美国节点, 日本节点, 新加坡节点, 全部节点, REJECT
微软服务 = select, 代理, DIRECT, 美国节点, 日本节点, 全部节点, REJECT
电报 = select, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 全部节点, REJECT
油管 = select, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 全部节点, REJECT
奈飞 = select, 代理, 美国节点, 日本节点, 新加坡节点, 香港节点, 全部节点, REJECT
迪士尼 = select, 代理, 美国节点, 日本节点, 新加坡节点, 香港节点, 全部节点, REJECT
Spotify = select, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 全部节点, REJECT
Emby = select, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 全部节点, REJECT
国外媒体 = select, 代理, 香港节点, 日本节点, 新加坡节点, 美国节点, 全部节点, REJECT
游戏平台 = select, 代理, DIRECT, 香港节点, 日本节点, 新加坡节点, 美国节点, 全部节点, REJECT

[Rule]
RULE-SET,LAN,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All_No_Resolve.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI_Resolve.list,OpenAI
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list,微软服务
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,电报
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list,油管
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Netflix/Netflix.list,奈飞
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Disney/Disney.list,迪士尼
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list,Spotify
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Emby/Emby.list,Emby
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Epic/Epic.list,游戏平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Sony/Sony.list,游戏平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Steam/Steam.list,游戏平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Nintendo/Nintendo.list,游戏平台
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMedia/ChinaMedia.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GlobalMedia/GlobalMedia_All_No_Resolve.list,国外媒体
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Proxy/Proxy_All_No_Resolve.list,代理,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMax/ChinaMax_All.list,DIRECT,extended-matching
FINAL,代理,dns-failed

[Host]
# Sub-Store officially recommends keeping its rewrite-only domain local so a
# failed module cannot send backend requests to the public sub.store service.
sub.store = 127.0.0.1

[MITM]
# Generate and trust the CA only after creating an editable copy.
h2 = true
