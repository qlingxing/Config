[Proxy]
# Add manual nodes in Surge's Proxies screen or to the imported local copy.
# My Node = ss, server.example.com, 443, encrypt-method=aes-256-gcm, password=CHANGE_ME

[Proxy Group]
# Quote every policy reference whose name contains spaces. Surge Mac 5 parses
# these references strictly, including rule targets and include-other-group.
# For a subscription, append policy-path=<your local subscription URL> to this
# group in the imported local copy. Manual nodes and subscription nodes remain
# available to every group below.
All Nodes = select, DIRECT, include-all-proxies=true
# Static groups avoid Mac 5 parser failures caused by combining dynamic policy
# inclusion, regular-expression filtering, and an automatic test group.
Proxy = select, DIRECT, "All Nodes"
Auto = select, DIRECT, "All Nodes"
Hong Kong = select, DIRECT, "All Nodes"
Japan = select, DIRECT, "All Nodes"
Singapore = select, DIRECT, "All Nodes"
United States = select, DIRECT, "All Nodes"
Taiwan = select, DIRECT, "All Nodes"

Apple = select, DIRECT, Proxy, "All Nodes"
OpenAI = select, Proxy, "All Nodes"
Microsoft = select, DIRECT, Proxy, "All Nodes"
Telegram = select, Proxy, "All Nodes"
YouTube = select, Proxy, "All Nodes"
Netflix = select, Proxy, "All Nodes"
Disney = select, Proxy, "All Nodes"
Spotify = select, Proxy, "All Nodes"
Emby = select, Proxy, "All Nodes"
Global Media = select, Proxy, "All Nodes"
Games = select, DIRECT, Proxy, "All Nodes"

[Rule]
# Keep the Mac 5 base profile local-only. Older builds can report a generic
# profile parsing error while loading URL-backed RULE-SET resources at import.
RULE-SET,LAN,DIRECT
FINAL,Proxy,dns-failed
