[Proxy]
# Add manual nodes in Surge's Proxies screen or to the imported local copy.
# My Node = ss, server.example.com, 443, encrypt-method=aes-256-gcm, password=CHANGE_ME

[Proxy Group]
# 启用官方 Sub-Store 模块后，此链接会加载 All 集合的 Surge Mac 产物。
# 手动节点和 Sub-Store 产物节点都会出现在全部节点中。
全部节点 = select, DIRECT, include-all-proxies=true, policy-path=https://sub.store/download/collection/All?target=SurgeMac, update-interval=86400
# Mac 5 使用静态选择器，避免动态节点筛选导致旧版本解析失败。
节点选择 = select, DIRECT, 全部节点
自动选择 = select, DIRECT, 全部节点
香港节点 = select, DIRECT, 全部节点
日本节点 = select, DIRECT, 全部节点
新加坡节点 = select, DIRECT, 全部节点
美国节点 = select, DIRECT, 全部节点
台湾节点 = select, DIRECT, 全部节点

苹果服务 = select, DIRECT, 节点选择, 全部节点
OpenAI = select, 节点选择, 全部节点
微软服务 = select, DIRECT, 节点选择, 全部节点
电报 = select, 节点选择, 全部节点
油管 = select, 节点选择, 全部节点
奈飞 = select, 节点选择, 全部节点
迪士尼 = select, 节点选择, 全部节点
Spotify = select, 节点选择, 全部节点
Emby = select, 节点选择, 全部节点
国外媒体 = select, 节点选择, 全部节点
游戏平台 = select, DIRECT, 节点选择, 全部节点

[Rule]
# Keep the Mac 5 base profile local-only. Older builds can report a generic
# profile parsing error while loading URL-backed RULE-SET resources at import.
RULE-SET,LAN,DIRECT
FINAL,节点选择,dns-failed
