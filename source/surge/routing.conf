[Proxy]
# Add manual nodes in Surge's Proxies screen or to the imported local copy.
# My Node = ss, server.example.com, 443, encrypt-method=aes-256-gcm, password=CHANGE_ME

[Proxy Group]
# Quote every policy reference whose name contains spaces. Surge Mac 5 parses
# these references strictly, including rule targets and include-other-group.
# Replace this inert group with policy-path=<your local subscription URL> when
# using a subscription. Manual nodes and subscription nodes share every group.
Subscription = select, REJECT
All Nodes = select, DIRECT, include-all-proxies=true, include-other-group=Subscription
Proxy = select, Auto, "Hong Kong", Japan, Singapore, "United States", Taiwan, "All Nodes", DIRECT
Auto = url-test, DIRECT, include-all-proxies=true, include-other-group=Subscription, interval=600, tolerance=100, timeout=5, evaluate-before-use=true
Hong Kong = select, include-all-proxies=true, include-other-group=Subscription, policy-regex-filter={{REGION_HONG_KONG}}
Japan = select, include-all-proxies=true, include-other-group=Subscription, policy-regex-filter={{REGION_JAPAN}}
Singapore = select, include-all-proxies=true, include-other-group=Subscription, policy-regex-filter={{REGION_SINGAPORE}}
United States = select, include-all-proxies=true, include-other-group=Subscription, policy-regex-filter={{REGION_UNITED_STATES}}
Taiwan = select, include-all-proxies=true, include-other-group=Subscription, policy-regex-filter={{REGION_TAIWAN}}

Apple = select, DIRECT, Proxy, "All Nodes", "Hong Kong", Japan, "United States"
OpenAI = select, "United States", Japan, Singapore, "All Nodes", Proxy
Microsoft = select, DIRECT, Proxy, "All Nodes", "United States", Japan
Telegram = select, Proxy, "All Nodes", "Hong Kong", Japan, Singapore, "United States"
YouTube = select, Proxy, "All Nodes", "Hong Kong", Japan, Singapore, "United States"
Netflix = select, "United States", Japan, Singapore, "Hong Kong", "All Nodes", Proxy
Disney = select, "United States", Japan, Singapore, "Hong Kong", "All Nodes", Proxy
Spotify = select, Proxy, "All Nodes", "Hong Kong", Japan, Singapore, "United States"
Emby = select, Proxy, "All Nodes", "Hong Kong", Japan, Singapore, "United States"
Global Media = select, Proxy, "All Nodes", "Hong Kong", Japan, Singapore, "United States"
Games = select, DIRECT, Proxy, "All Nodes", "Hong Kong", Japan, Singapore, "United States"

[Rule]
RULE-SET,SYSTEM,DIRECT
RULE-SET,LAN,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Apple/Apple_All_No_Resolve.list,Apple
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/OpenAI/OpenAI_Resolve.list,OpenAI
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Microsoft/Microsoft.list,Microsoft
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Telegram/Telegram.list,Telegram
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/YouTube/YouTube.list,YouTube
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Netflix/Netflix.list,Netflix
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Disney/Disney.list,Disney
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Spotify/Spotify.list,Spotify
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Emby/Emby.list,Emby
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Epic/Epic.list,Games
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Sony/Sony.list,Games
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Steam/Steam.list,Games
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Nintendo/Nintendo.list,Games
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/ChinaMedia/ChinaMedia.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/GlobalMedia/GlobalMedia_All_No_Resolve.list,"Global Media"
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/Proxy/Proxy_All_No_Resolve.list,Proxy,extended-matching
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/release/rule/Surge/ChinaMax/ChinaMax_All.list,DIRECT,extended-matching
FINAL,Proxy,dns-failed
